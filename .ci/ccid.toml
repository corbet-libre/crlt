schema = 1
project = "crlt"

[checks.verify]
kind = "commands"
fleet = true
commands = [
  ["ccid", "first-party"],
  ["cargo", "fmt", "--all", "--check"],
  ["cargo", "clippy", "--locked", "--all-targets", "--", "-D", "warnings"],
  ["cargo", "test", "--locked"],
  ["bash", "-c", "set -euo pipefail\nexport GITHUB_ACTIONS=true\nbash .ci/remote.sh"],
  # The sqld/TLS fixture must be up while the one instrumented execution runs, so
  # remote.sh starts it and hands the run its environment; the gate and its
  # exclusions are this manifest's [coverage] data. The arguments are the shared
  # defaults (workspace, all features, branch, /tests/ filter), so [coverage]
  # below declares only the reviewed exclusions.
  ["bash", "-c", "set -euo pipefail\nexport GITHUB_ACTIONS=true\nbash .ci/remote.sh --coverage"],
]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"], ["curl", "--version"], ["openssl", "version"], ["python3", "--version"], ["rustup", "run", "nightly", "rustc", "-vV"], ["rustup", "run", "nightly", "cargo", "llvm-cov", "--version"], ["clang", "--version"], ["pkg-config", "--version"]]
cache_env = ["LIBCLANG_PATH", "PKG_CONFIG_PATH", "NIX_CFLAGS_COMPILE", "NIX_LDFLAGS", "LD_LIBRARY_PATH"]
cache_outputs = ["coverage.json", "coverage.lcov", "coverage.txt"]

[checks.advisories]
kind = "commands"
commands = [["cargo", "deny", "--locked", "check", "advisories", "licenses", "bans", "sources", "-D", "unmaintained", "-D", "yanked"]]

[render]
render_schema = 2

[jobs.verify]
scheduler = "forgejo"
runs_on = "heavy"
events = ["push", "manual"]
checks = ["verify", "advisories"]
workflow = "ci"
command = ["bash", ".ci/run-cached.sh"]

[jobs.verify-pr]
scheduler = "forgejo"
runs_on = "light"
events = ["pull_request"]
checks = ["verify", "advisories"]
workflow = "pr"
command = ["bash", ".ci/run-cached.sh"]

