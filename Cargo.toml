[package]
name = "crlt"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
description = "Relational database facade over Turso/libSQL: connections, migrations, community namespaces"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"
repository = "https://git.corbet.ch/corbet-libre/crlt.git"
readme = "README.md"
publish = false
include = ["Cargo.toml", "src/**", "docs/**", "README.md", "LICENSE", "LICENSE.md", "LICENSES/LGPL-3.0-only.txt", "LICENSES/LGPL-3.0-linking-exception.txt", "LICENSES/GPL-3.0-only.txt"]

[dependencies]
deadpool = { version = "0.13.1", default-features = false, features = ["managed", "rt_tokio_1"] }
libsql = { version = "0.9.30", default-features = false, features = ["core"] }
libsql-hrana = "0.9.30"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sqlparser = { version = "0.63", features = ["visitor"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time"] }
url = "2"

[dev-dependencies]
rcgen = { version = "0.14", features = ["crypto"] }
tempfile = "3"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
