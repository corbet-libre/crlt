[advisories]
ignore = []

[licenses]
allow = [
    "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
    "CDLA-Permissive-2.0", "ISC", "MIT", "OpenSSL", "Unicode-3.0", "Unlicense",
    "Zlib", "LGPL-3.0-only WITH LGPL-3.0-linking-exception",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    { name = "hyper", version = "<1" },
    { name = "h2", version = "<0.4" },
    { name = "hyper-rustls", version = "<0.27" },
    { name = "rustls", version = "<0.23" },
    { name = "rustls-webpki", version = "<0.103.13" },
    { name = "rustls-pemfile" },
    { name = "native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
